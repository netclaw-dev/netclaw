name: Publish Skills Feed

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: arc-netclaw
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Fetch existing manifest
        run: |
          mkdir -p feeds/skills/.system
          status=$(curl -sSL -o ./feeds/skills/.system/existing-manifest.json \
            -w "%{http_code}" \
            https://feeds.netclaw.dev/skills/.system/manifest.json || true)

          if [ "$status" = "200" ]; then
            echo "Fetched existing manifest from feeds.netclaw.dev"
          elif [ "$status" = "404" ]; then
            echo "No existing manifest published yet (first publish)"
            rm -f ./feeds/skills/.system/existing-manifest.json
          else
            echo "Failed to fetch existing manifest (HTTP $status)" >&2
            exit 1
          fi

      - name: Generate cumulative manifest
        run: |
          chmod +x ./feeds/scripts/generate-skill-manifest.sh
          ./feeds/scripts/generate-skill-manifest.sh \
            --base-url https://skills.netclaw.dev \
            --existing-manifest ./feeds/skills/.system/existing-manifest.json

      - name: Upload skill files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          UPLOAD_LIST="./feeds/skills/.system/upload-list.txt"
          if [ ! -s "$UPLOAD_LIST" ]; then
            echo "No files to upload"
            exit 0
          fi

          while IFS=' ' read -r local_path r2_key; do
            [ -z "$local_path" ] && continue
            echo "Uploading $r2_key"
            npx wrangler r2 object put "netclaw-skills/$r2_key" \
              --file="$local_path" \
              --content-type=text/markdown
          done < "$UPLOAD_LIST"

      - name: Deploy manifest to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy feeds/ --project-name=netclaw-feeds

      - name: Validate R2 uploads
        run: |
          # Spot-check: fetch the first skill URL from the manifest and verify it resolves
          url=$(python3 -c "
          import json
          m = json.load(open('feeds/skills/.system/manifest.json'))
          print(m['skills'][0]['url'])
          ")
          echo "Validating: $url"
          status=$(curl -sSL -o /dev/null -w "%{http_code}" "$url")
          if [ "$status" != "200" ]; then
            echo "Validation failed: $url returned HTTP $status" >&2
            exit 1
          fi
          echo "Validation passed"
