name: Publish Skills Feed

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: arc-netclaw
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Fetch existing manifest
        run: |
          mkdir -p feeds/skills/.system
          status=$(curl -sSL -o ./feeds/skills/.system/existing-manifest.json \
            -w "%{http_code}" \
            https://feeds.netclaw.dev/skills/.system/manifest.json || true)

          if [ "$status" = "200" ]; then
            echo "Fetched existing manifest from feeds.netclaw.dev"
          elif [ "$status" = "404" ]; then
            echo "No existing manifest published yet (first publish)"
            rm -f ./feeds/skills/.system/existing-manifest.json
          else
            echo "Failed to fetch existing manifest (HTTP $status)" >&2
            exit 1
          fi

      - name: Generate cumulative manifest
        run: |
          chmod +x ./feeds/scripts/generate-skill-manifest.sh
          ./feeds/scripts/generate-skill-manifest.sh \
            --base-url https://skills.netclaw.dev \
            --existing-manifest ./feeds/skills/.system/existing-manifest.json

      - name: Install Wrangler
        run: |
          npm install wrangler@3.90.0 --include=optional
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Upload skill files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          UPLOAD_LIST="./feeds/skills/.system/upload-list.txt"
          if [ ! -s "$UPLOAD_LIST" ]; then
            echo "No files to upload"
            exit 0
          fi

          while IFS=' ' read -r local_path r2_key; do
            [ -z "$local_path" ] && continue
            echo "Uploading $r2_key"
            wrangler r2 object put "netclaw-skills/$r2_key" \
              --file="$local_path" \
              --content-type=text/markdown
          done < "$UPLOAD_LIST"

      - name: Deploy manifest to Cloudflare Pages
        # Pin --branch=dev so release-tag builds (detached HEAD) still
        # deploy to the production branch instead of a preview alias.
        # Without this, wrangler infers the branch name from git state
        # and tag builds land on head.netclaw-feeds.pages.dev while
        # feeds.netclaw.dev stays frozen on the last dev-branch deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy feeds/ --project-name=netclaw-feeds --branch=dev

      - name: Validate R2 uploads
        run: |
          # Spot-check: fetch the first skill URL from the manifest and verify it resolves
          url=$(python3 -c "
          import json
          m = json.load(open('feeds/skills/.system/manifest.json'))
          print(m['skills'][0]['url'])
          ")
          echo "Validating R2 URL: $url"
          status=$(curl -sSL -o /dev/null -w "%{http_code}" "$url")
          if [ "$status" != "200" ]; then
            echo "Validation failed: $url returned HTTP $status" >&2
            exit 1
          fi
          echo "R2 validation passed"

      - name: Validate custom-domain manifest propagation
        run: |
          # Confirm that feeds.netclaw.dev (the production custom domain) is
          # actually serving the manifest we just generated — not a stale one
          # from a preview deployment. Fails loudly if Pages routing is wrong.
          expected_updated_at=$(python3 -c "
          import json
          print(json.load(open('feeds/skills/.system/manifest.json'))['updatedAt'])
          ")
          for attempt in 1 2 3 4 5 6; do
            live_updated_at=$(curl -sSL --max-time 15 \
              https://feeds.netclaw.dev/skills/.system/manifest.json \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('updatedAt',''))" \
              2>/dev/null || true)
            echo "Attempt $attempt: live=$live_updated_at expected=$expected_updated_at"
            if [ "$live_updated_at" = "$expected_updated_at" ]; then
              echo "Custom-domain propagation confirmed"
              exit 0
            fi
            sleep 10
          done
          echo "Custom-domain validation failed: feeds.netclaw.dev is still serving a stale manifest" >&2
          echo "This usually means the Pages deploy landed on a preview branch instead of production." >&2
          exit 1
