name: validate_docker_image

# Builds and smoke-tests the release netclawd Docker image on every PR
# and dev/main/master push. Intentionally separate from pr_validation.yml
# (unit/integration tests + slopwatch) and smoke.yml (the native end-to-end
# smoke harness) because image construction is its own concern — when it
# breaks, the fix lives in the Dockerfile or the shared build script, not
# the .NET test suites.

on:
  push:
    branches:
      - master
      - dev
      - main
    paths:
      - 'docker/Dockerfile'
      - 'scripts/docker/build-image.sh'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/validate_docker_image.yml'
  pull_request:
    branches:
      - master
      - dev
      - main
    paths:
      - 'docker/Dockerfile'
      - 'scripts/docker/build-image.sh'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/validate_docker_image.yml'

permissions:
  contents: read

jobs:
  validate-docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: "./global.json"

      - name: "Set up QEMU for multi-arch emulation"
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Compute ephemeral image tag"
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Build netclawd image via shared script"
        shell: bash
        run: |
          chmod +x scripts/docker/build-image.sh
          IMAGE_REPO=netclawd-pr \
            scripts/docker/build-image.sh "${{ steps.tag.outputs.tag }}"

      - name: "Verify daemon reaches healthy state with minimal config"
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true

          # Ollama provider type needs no API key, so this job can run
          # without secrets. The endpoint is fake (:11434 on loopback) —
          # the daemon doesn't actually call it during startup or health
          # checks, so unreachable is fine.
          # Bind loopback (Local mode default) — the health probe runs
          # inside the container via docker exec, so no port mapping needed.
          docker run -d --name netclaw-validate-ok \
            -e NETCLAW_Daemon__Port=5199 \
            -e NETCLAW_Providers__validate__Type=ollama \
            -e NETCLAW_Providers__validate__Endpoint=http://127.0.0.1:11434 \
            -e NETCLAW_Models__Main__Provider=validate \
            -e NETCLAW_Models__Main__ModelId=qwen2:0.5b \
            "netclawd-pr:${{ steps.tag.outputs.tag }}" >/dev/null

          # Poll /api/health/ready for up to 60s from inside the container.
          for i in $(seq 1 60); do
            if docker exec netclaw-validate-ok curl -fsS http://127.0.0.1:5199/api/health/ready >/dev/null 2>&1; then
              echo "✓ Daemon reported healthy after ${i}s"
              docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true
              exit 0
            fi

            # Bail early if the container crashed mid-probe.
            running=$(docker inspect -f '{{.State.Running}}' netclaw-validate-ok 2>/dev/null || echo "false")
            if [[ "$running" != "true" ]]; then
              echo "ERROR: daemon container exited during health probe" >&2
              docker logs netclaw-validate-ok >&2 2>&1 || true
              docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true
              exit 1
            fi

            sleep 1
          done

          echo "ERROR: daemon did not report healthy within 60s" >&2
          docker logs netclaw-validate-ok >&2 2>&1 || true
          docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true
          exit 1

      - name: "Verify multi-arch manifest has distinct per-platform digests"
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          # Build both platforms locally and inspect their digests.
          # This catches the bug from #1091 where TARGETARCH was declared
          # after FROM and buildx defaulted both platforms to amd64.
          # QEMU must be set up before buildx to enable arm64 emulation.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t netclawd-pr:multi-arch-test \
            --load \
            -f docker/Dockerfile .

          # Extract the two digest entries from the manifest list.
          # For a correct multi-arch image, the amd64 and arm64 digests
          # MUST be different — if they're the same, the build baked the
          # same binary into both platforms (the #1091 bug).
          AMD64_DIGEST=$(docker buildx imagetools inspect netclawd-pr:multi-arch-test --format '{{ index .RepoDigests 0 }}' 2>/dev/null | grep amd64 | head -1 || true)
          ARM64_DIGEST=$(docker buildx imagetools inspect netclawd-pr:multi-arch-test --format '{{ index .RepoDigests 0 }}' 2>/dev/null | grep arm64 | head -1 || true)

          if [[ -z "$AMD64_DIGEST" || -z "$ARM64_DIGEST" ]]; then
            echo "WARNING: Could not extract per-platform digests from manifest list" >&2
            echo "This may indicate the manifest is not a proper list." >&2
            # Show what we got for debugging
            docker buildx imagetools inspect netclawd-pr:multi-arch-test >&2 || true
            exit 1
          fi

          if [[ "$AMD64_DIGEST" == "$ARM64_DIGEST" ]]; then
            echo "ERROR: multi-arch manifest has the SAME digest for both platforms!" >&2
            echo "  amd64: $AMD64_DIGEST" >&2
            echo "  arm64: $ARM64_DIGEST" >&2
            echo "This means the Dockerfile is not correctly using TARGETARCH" >&2
            echo "in a way that buildx can resolve per-platform." >&2
            exit 1
          fi

          echo "✓ Multi-arch manifest verified: amd64 and arm64 have distinct digests"
          echo "  amd64: $AMD64_DIGEST"
          echo "  arm64: $ARM64_DIGEST"

      - name: "Verify TARGETARCH is declared before FROM"
        shell: bash
        run: |
          set -euo pipefail

          # In a multi-platform build, ARGs declared after FROM are not
          # per-platform — buildx resolves them to their default for all
          # architectures. This catches the #1091 class of bug on every
          # PR/merge, not just pushes (since --load needs QEMU).
          DOCKERFILE="docker/Dockerfile"

          # Find line numbers of FROM and all ARG declarations
          FROM_LINE=$(grep -n "^FROM" "$DOCKERFILE" | head -1 | cut -d: -f1)
          ARG_BEFORE_FROM=$(grep -n "^ARG TARGET" "$DOCKERFILE" | while IFS=: read -r line _; do
            if [[ "$line" -lt "$FROM_LINE" ]]; then
              echo "FOUND"
              break
            fi
          done)

          if [[ -z "$ARG_BEFORE_FROM" ]]; then
            echo "ERROR: ARG TARGETARCH must be declared BEFORE FROM for multi-arch builds (#1091)" >&2
            echo "  FROM is on line $FROM_LINE" >&2
            echo "  ARG TARGET declarations must appear above it" >&2
            echo "" >&2
            echo "Example:" >&2
            echo "  ARG TARGETARCH=amd64" >&2
            echo "  ARG NETCLAW_VERSION=unknown" >&2
            echo "  FROM ubuntu:24.04" >&2
            exit 1
          fi

          echo "✓ ARG TARGETARCH is declared before FROM (line $FROM_LINE)"

      - name: "Cleanup validation containers"
        if: always()
        shell: bash
        run: |
          docker rm -f netclaw-validate-ok 2>/dev/null || true
          docker rmi netclawd-pr:multi-arch-test 2>/dev/null || true
