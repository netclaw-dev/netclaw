syntax = "proto3";

option csharp_namespace = "Netclaw.Actors.Serialization.Proto";

// ── Enums ──

enum ChatRole {
  CHAT_ROLE_USER = 0;
  CHAT_ROLE_ASSISTANT = 1;
  CHAT_ROLE_SYSTEM = 2;
  CHAT_ROLE_TOOL = 3;
}

enum DeliveryKind {
  DELIVERY_KIND_CURRENT_SESSION = 0;
  DELIVERY_KIND_CHANNEL = 1;
  DELIVERY_KIND_NONE = 2;
}

enum ReminderScheduleType {
  REMINDER_SCHEDULE_TYPE_ONE_SHOT = 0;
  REMINDER_SCHEDULE_TYPE_INTERVAL = 1;
  REMINDER_SCHEDULE_TYPE_CRON = 2;
}

enum TrustAudience {
  TRUST_AUDIENCE_PUBLIC = 0;
  TRUST_AUDIENCE_TEAM = 1;
  TRUST_AUDIENCE_PERSONAL = 2;
}

enum ChannelType {
  CHANNEL_TYPE_SLACK = 0;
  CHANNEL_TYPE_TUI = 1;
  CHANNEL_TYPE_HEADLESS = 2;
  CHANNEL_TYPE_SIGNALR = 3;
  CHANNEL_TYPE_REMINDER = 4;
  CHANNEL_TYPE_WEBHOOK = 5;
  CHANNEL_TYPE_DISCORD = 6;
  CHANNEL_TYPE_MATTERMOST = 7;
}

// ── Value types ──

message SessionIdProto {
  string value = 1;
}

message ReminderIdProto {
  string value = 1;
}

// ── Chat messages ──

message SerializableMediaReferenceProto {
  string relative_path = 1;
  string mime_type = 2;
  int32 modality = 3;
  // Raw file size in bytes. Zero for records persisted before this field
  // was added — see SerializableMediaReference.FileSizeBytes.
  int64 file_size_bytes = 4;
}

message SerializableToolCallProto {
  string call_id = 1;
  string name = 2;
  string arguments_json = 3;
  optional string meta_json = 4;
}

message SerializableChatMessageProto {
  ChatRole role = 1;
  string content = 2;
  optional string name = 3;
  repeated SerializableToolCallProto tool_calls = 4;
  optional string tool_call_id = 5;
  repeated SerializableMediaReferenceProto media_references = 6;
}

// ── Commands ──

message SendUserMessageProto {
  SessionIdProto session_id = 1;
  string content = 2;
  repeated SerializableMediaReferenceProto media_references = 3;
}

// ── Events ──

message TurnRecordedProto {
  SessionIdProto session_id = 1;
  SerializableChatMessageProto user_message = 2;
  SerializableChatMessageProto assistant_reply = 3;
  int64 recorded_at_ms = 4;
  optional string source_reminder_id = 5;
  optional string source_background_job_id = 6;
  repeated string consumed_input_ids = 7;
}

message InputAdmittedProto {
  SessionIdProto session_id = 1;
  string input_id = 2;
  optional string source_message_id = 3;
  SerializableChatMessageProto user_message = 4;
  optional string executable_text = 5;
  ToolApprovalRequestedProto.TurnContextRecordProto turn_context = 6;
  int64 admitted_at_ms = 9;
  optional string source_background_job_id = 10;
  int32 background_job_lineage_version = 11;
  BackgroundJobOriginProto background_job_origin = 12;
  optional string source_child_run_id = 13;
  reserved 7, 8;
}

message BackgroundJobOriginProto { string turn_id = 1; string call_id = 2; }

message ToolTaskAdoptedProto {
  SessionIdProto session_id = 1;
  ToolApprovalRequestedProto.TurnContextRecordProto turn_context = 2;
  repeated string input_ids = 3;
  int64 adopted_at_ms = 4;
  optional string continued_job_key = 5;
  optional string continued_child_run_id = 6;
  bool starts_child_continuation_window = 7;
}

message InputClosedProto {
  SessionIdProto session_id = 1;
  repeated string input_ids = 2;
  int64 closed_at_ms = 3;
  optional string task_id = 4;
  optional string source_background_job_id = 5;
  SerializableChatMessageProto rejected_job_report = 6;
}

message SessionTitleSetProto {
  SessionIdProto session_id = 1;
  string title = 2;
  int64 set_at_ms = 3;
}

message SessionCompactedProto {
  SessionIdProto session_id = 1;
  string summary = 2;
  repeated SerializableChatMessageProto compacted_messages = 3;
  int32 turn_count_before = 4;
  int64 compacted_at_ms = 5;
  reserved 6;
  WorkingContextProto working_context = 7;
}

message ToolLoopPreparedCallProto {
  string call_id = 1; string tool_name = 2; string arguments_hash = 3; bool allows_pending_job = 4;
}
message ToolLoopAdmissionProto {
  string task_id = 1; string action_hash = 2; repeated ToolLoopPreparedCallProto calls = 3;
  repeated string refused_call_ids = 4;
}
message ToolLoopObservationProto {
  string call_id = 1; int32 category = 2; string result_hash = 3;
  bool pending_job = 4; bool synthetic = 5; bool missing_receipt = 6;
}

message ToolBatchStartedProto {
  SessionIdProto session_id = 1;
  SerializableChatMessageProto user_message = 2;
  SerializableChatMessageProto assistant_message = 3;
  int64 started_at_ms = 4;
  repeated string consumed_input_ids = 5;
  ToolLoopAdmissionProto loop_admission = 7;
  bool metadata_only = 9;
  ToolApprovalRequestedProto.TurnContextRecordProto legacy_task_context = 10;
}

message ToolCallRecordedProto {
  SessionIdProto session_id = 1;
  SerializableChatMessageProto tool_result = 2;
  int64 recorded_at_ms = 3;
  ToolLoopObservationProto loop_observation = 4;
  ActiveJobInfoProto started_background_job = 5;
}

message ToolApprovalRequestedProto {
  message ApprovalCandidateProto {
    string verb = 1;
    optional string directory = 2;
    repeated string verb_tokens = 3;
    optional int32 shell = 4;
    optional int32 assignment_constraint_kind = 5;
    optional string assignment_digest = 6;
  }

  message TurnContextRecordProto {
    message ChannelDeliveryTargetRecordProto {
      string channel_key = 1;
      string destination_kind = 2;
      string destination_id = 3;
      optional string destination_display_name = 4;
      optional string thread_or_root_id = 5;
    }

    SessionIdProto session_id = 1;
    string turn_id = 2;
    TrustAudience audience = 3;
    optional string boundary = 4;
    optional string channel_type = 5;
    optional string requester_sender_id = 6;
    optional int32 requester_principal = 7;
    int32 transport_authenticity = 8;
    int32 payload_taint = 9;
    optional string source_scope = 10;
    optional string source_kind = 11;
    bool has_adopted_context = 12;
    bool has_third_party_adopted_context = 13;
    repeated string adopted_speaker_ids = 14;
    bool supports_interactive_approval = 15;
    ChannelDeliveryTargetRecordProto default_delivery_target = 16;
    ChannelDeliveryTargetRecordProto requested_delivery_target = 17;
  }

  SessionIdProto session_id = 1;
  string call_id = 2;
  string tool_name = 3;
  repeated string patterns = 4;
  repeated string candidate_verbs = 5;
  TrustAudience audience = 6;
  optional string requester_sender_id = 7;
  optional int32 requester_principal = 8;
  optional string cwd = 9;
  repeated ApprovalCandidateProto candidates = 10;
  optional string boundary = 11;
  optional string channel_type = 12;
  optional bool supports_interactive_approval = 13;
  int64 requested_at_ms = 14;
  repeated string option_keys = 15;
  bool has_third_party_adopted_context = 16;
  repeated string adopted_speaker_ids = 17;
  TurnContextRecordProto turn_context = 18;
  optional string session_scratch_directory = 19;
  optional string authorization_attempt_id = 20;
  optional string managed_temporary_directory = 21;
  optional string repository_common_directory = 22;
  optional string source_child_run_id = 23;
  optional string original_child_call_id = 24;
}

message ToolApprovalResolvedProto {
  SessionIdProto session_id = 1;
  string call_id = 2;
  string decision = 3;
  int64 resolved_at_ms = 4;
  optional string authorization_attempt_id = 5;
  optional string source_child_run_id = 6;
}

message ToolBatchAbandonedProto {
  SessionIdProto session_id = 1;
  repeated SerializableChatMessageProto tool_results = 2;
  int64 abandoned_at_ms = 3;
}

message SessionBackgroundJobsReapedProto {
  SessionIdProto session_id = 1;
  int64 reaped_at_ms = 2;
}

// ── Adopted context ──

message AdoptedContextRecordedProto {
  message AdoptedMessageRecordProto {
    string message_id = 1;
    string sender_id = 2;
    int64 timestamp_ms = 3;
    string authority_at_inclusion = 4;
  }

  SessionIdProto session_id = 1;
  string authorized_message_id = 2;
  optional string authorizer_sender_id = 3;
  optional string lower_bound = 4;
  optional string upper_bound = 5;
  string projection = 6;
  repeated AdoptedMessageRecordProto messages = 7;
  bool projection_persisted = 8;
  int64 recorded_at_ms = 9;
  bool has_third_party_adopted_context = 10;
  bool has_adopted_context = 11;
  repeated string adopted_speaker_ids = 12;
}

// ── Snapshots ──

message ActiveJobInfoProto {
  string job_id = 1;
  string command = 2;
  string rationale = 3;
  int64 started_at_ms = 4;
  TrustAudience audience = 5;
  string boundary = 6;
  // 0 = not reaped (proto3 cannot express absence for scalars).
  int64 reaped_at_ms = 7;
  string output_log_path = 8;
  int32 lineage_version = 9;
  BackgroundJobOriginProto origin = 10;
}

message SessionSnapshotProto {
  message AdoptedContextSnapshotRecord {
    message AdoptedContextSnapshotMessage {
      string message_id = 1;
      string sender_id = 2;
      int64 timestamp_ms = 3;
      string authority_at_inclusion = 4;
    }

    string authorized_message_id = 1;
    optional string authorizer_sender_id = 2;
    optional string lower_bound = 3;
    optional string upper_bound = 4;
    string projection = 5;
    bool projection_persisted = 6;
    repeated AdoptedContextSnapshotMessage messages = 7;
    bool has_third_party_adopted_context = 8;
    bool has_adopted_context = 9;
    repeated string adopted_speaker_ids = 10;
  }

  repeated SerializableChatMessageProto history = 1;
  int32 turn_count = 2;
  optional string title = 3;
  optional int32 eligible_delivery_turn_number = 4;
  reserved 5;
  WorkingContextProto working_context = 6;
  repeated ActiveJobInfoProto active_background_jobs = 7;
  repeated AdoptedContextSnapshotRecord adopted_context_records = 8;
  reserved 9;
  repeated InputAdmittedProto pending_inputs = 10;
  repeated string recent_source_message_keys = 11;
  ToolLoopAdmissionProto loop_admission = 13;
  repeated ToolLoopObservationProto loop_observations = 14;
  bool loop_receipt_failure = 15;
  ToolApprovalRequestedProto.TurnContextRecordProto adopted_task_context = 16;
  repeated string adopted_task_input_ids = 17;
  repeated string processed_background_job_ids = 18;
  repeated BackgroundChildRunProto child_runs = 19;
}

// ── Session state ──

message WorkingContextProto {
  repeated string recent_files = 1;
  optional string project_directory = 2;
}

// ── Channel delivery target (top-level, reusable) ──

message ChannelDeliveryTargetProto {
  string channel_key = 1;
  string destination_kind = 2;
  string destination_id = 3;
  optional string destination_display_name = 4;
  optional string thread_or_root_id = 5;
}

// ── Reminders ──

message ReminderDeliveryProto {
  DeliveryKind kind = 1;
  optional string transport = 2;
  optional string address = 3;
  optional string session_id = 4;
  optional ChannelType origin_channel_type = 5;
  optional ChannelDeliveryTargetProto target = 6;
}

message ReminderScheduleProto {
  ReminderScheduleType type = 1;
  optional int64 fire_at_ms = 2;
  optional int64 interval_ticks = 3;
  optional string cron_expression = 4;
  optional string original_expression = 5;
}

message ReminderPayloadProto {
  ReminderIdProto id = 1;
}

// ── Channel cursor ──

message CursorAdvancedProto {
  string cursor = 1;
}

message PendingApprovalPromptTrackedProto {
  string call_id = 1;
  optional string requester_sender_id = 2;
  optional int32 requester_principal = 3;
  repeated string option_keys = 4;
  string prompt_id = 5;
  optional string tool_name = 6;
  optional string display_text = 7;
}

message PendingApprovalPromptClearedProto {
  string call_id = 1;
}

// ── Memory observer events ──

// Journaled by SessionMemoryObserverActor when a distillation completes.
// Each entry carries an anchor (the memory's slug) plus the title and content
// context used for semantic dedup against future distillation runs.
message ProposedMemoryContextProto {
  string anchor = 1;
  string title = 2;
  string content = 3;
}

message MemoriesDistilledV2Proto {
  repeated string anchors = 1;
  repeated ProposedMemoryContextProto proposals = 2;
  int64 timestamp_ms = 3;
}

// Durable child acceptance. Live authority objects remain in the owner adapter.
message ChildRunAcceptedProto {
  string session_id = 1;
  BackgroundChildRunProto run = 2;
}

message BackgroundChildRunProto {
  string run_id = 1;
  string scope_id = 2;
  string owner_session_id = 3;
  string original_turn_id = 4;
  oneof activation {
    string tool_call_id = 5;
    string slash_input_id = 6;
  }
  string agent_name = 7;
  string source_operation = 8;
  string arguments_digest = 9;
  ToolApprovalRequestedProto.TurnContextRecordProto original_context = 10;
  repeated string origin_input_ids = 11;
  WorkingContextProto initial_working_context = 12;
  GitWorkingContextInspectionProto initial_git = 13;
  bool start_batch_settled = 16;
  int64 accepted_at_ms = 17;
  optional int64 started_at_ms = 18;
  optional int64 cancellation_requested_at_ms = 19;
  optional int64 dispatch_closed_at_ms = 20;
  ChildRunCheckpointProto child_checkpoint = 21;
  ChildRunTerminalProto terminal = 22;
  ChildRunTerminalProto prepared_terminal = 23;
  optional string delivery_input_id = 24;
  optional int64 terminal_sequence_nr = 25;
  repeated ChildRunApprovalProto approvals = 26;
}

message GitWorkingContextInspectionProto {
  enum Kind {
    UNSET = 0;
    SKIPPED = 1;
    AVAILABLE = 2;
    NOT_REPOSITORY = 3;
    EXECUTABLE_NOT_FOUND = 4;
    UNAVAILABLE = 5;
  }
  Kind kind = 1;
  optional string reason = 2;
  string worktree = 3;
  string common_directory = 4;
  optional string branch = 5;
  bool detached = 6;
  optional string head = 7;
  optional string upstream = 8;
  int32 ahead = 9;
  int32 behind = 10;
  int32 staged = 11;
  int32 modified = 12;
  int32 untracked = 13;
  repeated string changed_files = 14;
}

message ChildRunCheckpointProto {
  int32 completed_round = 1;
  string summary = 2;
  ChildWorkingContextProto confirmed_activity = 3;
}
message ChildWorkingContextProto {
  optional string project_directory = 1;
  optional string worktree = 2;
  optional string branch = 3;
  optional string head = 4;
  repeated string read_files = 5;
  repeated string confirmed_changed_files = 6;
  repeated string observed_changed_files = 7;
}
message ChildFindingProto {
  int32 shape = 1;
  string title = 2;
  string content = 3;
  string kind = 4;
  int32 sensitivity = 5;
  int32 recall_mode = 6;
  string update_semantics = 7;
  double confidence = 8;
  int32 durability = 9;
  int32 reusability = 10;
  repeated string evidence = 11;
  optional int64 freshness_at_ms = 12;
}
message ChildRunTerminalProto {
  bool lost = 1;
  optional string evidence_warning = 2;
  string output = 3;
  int32 outcome = 4;
  optional string outcome_reason = 5;
  string run_id = 6;
  string scope_id = 7;
  string agent_name = 8;
  ChildWorkingContextProto working_context = 9;
  repeated ChildFindingProto findings = 10;
  int32 findings_count = 11;
  optional string log_path = 12;
  optional string artifact_directory = 13;
}
message ChildRunEventProto {
  string session_id = 1;
  string run_id = 2;
  int64 recorded_at_ms = 3;
  oneof fact {
    bool started = 4;
    ChildRunCheckpointProto checkpoint = 5;
    bool cancellation_requested = 6;
    bool dispatch_closed = 7;
    ChildRunTerminalProto terminal = 8;
    ChildRunTerminalProto prepared = 9;
    InputAdmittedProto delivery = 10;
  }
  int64 terminal_sequence_nr = 11;
}

message ChildRunApprovalProto {
  ToolApprovalRequestedProto request = 1;
  ToolApprovalResolvedProto resolution = 2;
}
