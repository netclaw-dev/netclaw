name: pr_validation

on:
  # Merge queues test a synthetic merge group rather than the pull request ref.
  # Required checks must subscribe to this event or queued PRs will never merge.
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main
      - feature/*

permissions:
  contents: read

jobs:
  test:
    name: Test-${{matrix.os}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-26
            rid: osx-arm64

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Validate release notes parser"
        shell: pwsh
        run: ./scripts/smoke/release-notes-smoke.ps1

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      # .NET Framework tests can't run reliably on Linux, so we only do .NET 8

      - name: "dotnet test"
        shell: bash
        # blame-hang aborts + writes a Sequence file (naming the in-flight test) and a full process
        # dump if a test stalls (no test activity) for 300s, so a hang fails fast (~minutes, not the
        # 30-min job cap) and is diagnosable from the CI log + the uploaded dump instead of a silent
        # timeout. The full dump carries every thread's stack — needed to confirm the suspected
        # macOS/ARM64 weak-memory-ordering hang in the TUI view-models.
        run: dotnet test -c Release --filter "Category!=NativeShell" --blame-hang-timeout 300s --blame-hang-dump-type full --results-directory ./TestResults

      - name: "dotnet test (native shell, serial)"
        if: runner.os == 'Windows'
        shell: bash
        # The native PowerShell test needs an isolated Windows host.
        run: dotnet test -c Release --no-build --filter "Category=NativeShell" --blame-hang-timeout 300s --blame-hang-dump-type full --results-directory ./TestResults

      # Diagnostic: surface the blame Sequence file (names the stuck test) in the CI log so a
      # platform-specific hang can be pinpointed even without downloading the dump artifact.
      - name: "Show hang sequence (if a test hung)"
        if: always()
        shell: bash
        run: |
          seq=$(find ./TestResults -name '*Sequence*.xml' 2>/dev/null || true)
          if [ -n "$seq" ]; then
            for f in $seq; do echo "===== HANG SEQUENCE: $f ====="; cat "$f"; echo; done
          else
            echo "No blame Sequence file — no test hang detected."
          fi

      # The VSTest adapter shows only "Test Assembly Cleanup Failure" for the temp-leak gate.
      # The gate also writes its report next to the test assembly. Print it here.
      - name: "Show test temp leaks (if a test leaked)"
        if: always()
        shell: bash
        run: |
          reports=$(find ./src ./tests -name 'test-temp-leaks.txt' 2>/dev/null || true)
          if [ -n "$reports" ]; then
            for f in $reports; do echo "===== TEST TEMP LEAKS: $f ====="; cat "$f"; echo; done
          else
            echo "No test temp leak report."
          fi

      # Upload the hang dump + sequence file so a dedicated agent can open the dump (dotnet-dump
      # analyze / lldb) and read the stalled thread stacks. Per-OS name; only the macOS run is
      # expected to produce one today.
      - name: "Upload hang dump"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-hang-dump-${{ matrix.os }}
          path: ./TestResults
          if-no-files-found: ignore
          retention-days: 14

      - name: "Publish CLI (single-file, self-contained)"
        if: runner.os != 'Windows'
        run: >
          dotnet publish src/Netclaw.Cli/Netclaw.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:EnableCompressionInSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/cli

      - name: "Package and stage CLI binary (simulate release install)"
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ./archives ./install-test
          tar czf ./archives/netclaw-test.tar.gz -C ./publish/cli netclaw
          tar xzf ./archives/netclaw-test.tar.gz -C ./install-test

      - name: "CLI smoke tests"
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke/cli-smoke.sh
        env:
          NETCLAW_CLI: ./install-test/netclaw

  mutation-gates:
    # One job definition for every focused Stryker gate. Each matrix group shares
    # one checkout, SDK install, and tool restore. To add a gate, add its script
    # name (scripts/run-<name>-mutations.sh) to the lightest group. The groups
    # use measured gate time. Add new targets to the lightest group and retain
    # the 25-minute timeout.
    name: Mutation Gates (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shell-analysis
            gates: shell-command-analysis tool-authorizer-order mcp-artifact-admission
          - group: shell-assignment-and-paths
            gates: shell-assignment shell-config-read path-access tool-task-adoption
          - group: verb-chain-and-reminder
            gates: exact-verb-chain reminder-execution literal-twin
          - group: approval-and-authorization
            gates: tool-authorization approval-directory skill-manage-guard no-program

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      # Run every gate in the group, even after a failure, so one run reports
      # all failed gates. The step fails if any gate fails.
      - name: "Run mutation gates"
        env:
          GATES: ${{ matrix.gates }}
        run: |
          failed=()
          for gate in $GATES; do
            echo "::group::$gate"
            if "./scripts/run-${gate}-mutations.sh"; then
              echo "- \`$gate\`: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$gate\`: FAILED" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$gate")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::Mutation gates failed: ${failed[*]}"
            exit 1
          fi

      - name: "Upload mutation reports"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports-${{ matrix.group }}
          path: ./artifacts/stryker
          if-no-files-found: ignore
          retention-days: 14

  copyright-headers:
    name: Copyright Headers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "Verify copyright headers"
        shell: pwsh
        run: ./scripts/Add-FileHeaders.ps1 -Verify

  no-bom:
    name: No UTF-8 BOM
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "Verify no .cs file starts with a UTF-8 BOM"
        shell: bash
        run: bash scripts/check-no-bom.sh

  slopwatch:
    name: Slopwatch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "slopwatch analyze"
        run: dotnet slopwatch analyze

  install-smoke:
    name: Install Script Smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "Install shell integration test dependencies"
        if: runner.os == 'Linux'
        run: bash scripts/smoke/install-shell-test-dependencies.sh

      - name: "install.sh smoke test"
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke/install-smoke.sh

      - name: "install.ps1 smoke test"
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/install-smoke.ps1

      - name: "install.ps1 Windows PowerShell 5.1 smoke test"
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke/install-smoke.ps1

  eval-oracles:
    name: Eval Oracle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install eval assertion dependencies
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - name: Check eval assertions and fixture protocol
        run: |
          bash -n evals/run-evals.sh
          bash -n evals/run-background-evals.sh
          bash -n evals/cycle_evals.sh
          python3 -m unittest discover -s evals -p test_background_evals.py -v
          python3 -m unittest discover -s evals -p test_child_run_evals.py -v
          python3 -m unittest discover -s evals -p test_coordination_evals.py -v
          python3 -m unittest discover -s evals -p test_init_agent_profiles.py -v
          python3 -m unittest discover -s evals -p test_eval_approval_seed.py -v
          python3 -m unittest discover -s evals -p test_coordination_artifact_evals.py -v
          python3 -m unittest discover -s evals -p test_coordination_workflow_evals.py -v
          python3 -m unittest discover -s evals -p test_coordination_negative_evals.py -v
          python3 -m unittest discover -s evals -p test_productive_parent_child_evals.py -v
          python3 -m unittest discover -s evals -p test_coordination_implement_review_evals.py -v
          python3 -m unittest discover -s evals -p test_coordination_stale_incomplete_evals.py -v
          python3 -m unittest discover -s evals -p test_coordination_conflicting_evidence_evals.py -v
          python3 -m unittest discover -s evals -p test_cycle_evals.py -v
          python3 -m unittest discover -s evals -p test_cli_detector_evals.py -v
          python3 -m unittest discover -s evals -p test_spill_steer_evals.py -v
          python3 -m unittest discover -s tests/smoke -p test_mcp_permissions_save_assertion.py -v

  approval-outcome-direction:
    name: Approval Outcome Direction
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The check reads the review snapshot at the base revision with git show,
      # so it needs the base history.
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Self-tests"
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      # An allowed case must stay allowed, and a denied case must stay denied.
      # See TOOLING.md "Outcome Direction Check".
      - name: "Check approval outcome direction"
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              python3 scripts/check-approval-outcome-direction.py --base-ref "origin/$PR_BASE_REF" ;;
            merge_group)
              python3 scripts/check-approval-outcome-direction.py --base-rev "$MERGE_GROUP_BASE_SHA" ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                echo "New branch push: compare with the merge base of origin/dev."
                python3 scripts/check-approval-outcome-direction.py --base-ref origin/dev
              elif ! git merge-base --is-ancestor "$PUSH_BEFORE_SHA" HEAD 2>/dev/null; then
                # A force push (for example, GitHub rebasing a stacked PR) replaces
                # the history. The previous head is then not in this clone.
                echo "Force push: $PUSH_BEFORE_SHA is not an ancestor of HEAD. Compare with the merge base of origin/dev."
                python3 scripts/check-approval-outcome-direction.py --base-ref origin/dev
              else
                python3 scripts/check-approval-outcome-direction.py --base-rev "$PUSH_BEFORE_SHA"
              fi ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 2 ;;
          esac

  semver-conformance:
    name: SemVer Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The C# side (SemVerConformanceTests) runs in the Test job; this asserts the
      # release-manifest generator's precedence key agrees with the same shared fixture,
      # so the two implementations can't silently drift.
      - name: "Generator precedence key matches the shared fixture"
        run: python3 feeds/scripts/semver_key.py --check feeds/scripts/semver-order.txt
