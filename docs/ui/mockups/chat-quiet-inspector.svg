  <text x="371" y="469" class="small muted">09:57</text>

  <rect x="464" y="92" width="922" height="696" rx="4" fill="#171a21"/>
  <rect x="464" y="92" width="6" height="696" fill="#89b4fa"/>
  <text x="494" y="132" class="small primary bold">TOOL RESULT</text>
  <text x="494" y="171" class="small muted">compare package manifest</text>

  <text x="494" y="220" class="small muted">CALL</text>
  <text x="605" y="220" class="small">call_62c8</text>
  <text x="494" y="258" class="small muted">STATUS</text>
  <text x="605" y="258" class="small success">completed</text>
  <text x="494" y="296" class="small muted">DURATION</text>
