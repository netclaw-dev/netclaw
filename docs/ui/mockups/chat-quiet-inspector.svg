  <text x="371" y="311" class="small muted">8.4s</text>

  <rect x="66" y="332" width="362" height="52" rx="3" fill="#24354d"/>
  <text x="78" y="364" class="small primary bold">Tool</text>
  <text x="142" y="364" class="small">compare manifest</text>
  <text x="371" y="364" class="small muted">3.1s</text>

