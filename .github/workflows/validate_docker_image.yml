name: validate_docker_image

# Builds and smoke-tests the release netclawd Docker image on every PR
# and dev/main/master push. Intentionally separate from pr_validation.yml
# (unit/integration tests + slopwatch) and smoke.yml (the native end-to-end
# smoke harness) because image construction is its own concern — when it
# breaks, the fix lives in the Dockerfile or the shared build script, not
# the .NET test suites.

on:
  push:
    branches:
      - master
      - dev
      - main
    paths:
      - 'docker/Dockerfile'
      - 'scripts/docker/build-image.sh'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/validate_docker_image.yml'
  pull_request:
    branches:
      - master
      - dev
      - main
    paths:
      - 'docker/Dockerfile'
      - 'scripts/docker/build-image.sh'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/validate_docker_image.yml'

permissions:
  contents: read

jobs:
  validate-docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: "./global.json"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Compute ephemeral image tag"
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Build netclawd image via shared script"
        shell: bash
        run: |
          chmod +x scripts/docker/build-image.sh
          IMAGE_REPO=netclawd-pr \
            scripts/docker/build-image.sh "${{ steps.tag.outputs.tag }}"

      - name: "Verify daemon reaches healthy state with minimal config"
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true

          # Ollama provider type needs no API key, so this job can run
          # without secrets. The endpoint is fake (:11434 on loopback) —
          # the daemon doesn't actually call it during startup or health
          # checks, so unreachable is fine.
          # Bind loopback (Local mode default) — the health probe runs
          # inside the container via docker exec, so no port mapping needed.
          docker run -d --name netclaw-validate-ok \
            -e NETCLAW_Daemon__Port=5199 \
            -e NETCLAW_Providers__validate__Type=ollama \
            -e NETCLAW_Providers__validate__Endpoint=http://127.0.0.1:11434 \
            -e NETCLAW_Models__Main__Provider=validate \
            -e NETCLAW_Models__Main__ModelId=qwen2:0.5b \
            "netclawd-pr:${{ steps.tag.outputs.tag }}" >/dev/null

          # Poll /api/health/ready for up to 60s from inside the container.
          for i in $(seq 1 60); do
            if docker exec netclaw-validate-ok curl -fsS http://127.0.0.1:5199/api/health/ready >/dev/null 2>&1; then
              echo "✓ Daemon reported healthy after ${i}s"
              docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true
              exit 0
            fi

            # Bail early if the container crashed mid-probe.
            running=$(docker inspect -f '{{.State.Running}}' netclaw-validate-ok 2>/dev/null || echo "false")
            if [[ "$running" != "true" ]]; then
              echo "ERROR: daemon container exited during health probe" >&2
              docker logs netclaw-validate-ok >&2 2>&1 || true
              docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true
              exit 1
            fi

            sleep 1
          done

          echo "ERROR: daemon did not report healthy within 60s" >&2
          docker logs netclaw-validate-ok >&2 2>&1 || true
          docker rm -f netclaw-validate-ok >/dev/null 2>&1 || true
          exit 1

      - name: "Lint: ARG TARGETARCH must have no default (#1091)"
        shell: bash
        run: |
          set -euo pipefail

          # #1091 root cause: writing `ARG TARGETARCH=<default>` inside a
          # build stage shadows buildx's per-platform injection. Both
          # manifest entries silently get the same arch (whatever the
          # default is). Verified empirically: `docker buildx build
          # --platform linux/386 ...` with `ARG TARGETARCH=amd64` after
          # FROM resolves TARGETARCH to `amd64`, not `386`.
          #
          # Canonical Docker pattern is `ARG TARGETARCH` (no default).
          # The same applies to TARGETOS, TARGETPLATFORM, TARGETVARIANT,
          # BUILDARCH, BUILDOS, BUILDPLATFORM, BUILDVARIANT — all of the
          # predefined platform ARGs auto-injected by buildx.
          DOCKERFILE="docker/Dockerfile"
          PREDEFINED='TARGETARCH|TARGETOS|TARGETPLATFORM|TARGETVARIANT|BUILDARCH|BUILDOS|BUILDPLATFORM|BUILDVARIANT'

          if matches=$(grep -nE "^ARG (${PREDEFINED})=" "$DOCKERFILE"); then
            echo "ERROR: predefined platform ARG declared with a default value (#1091)" >&2
            echo "$matches" | sed 's/^/  /' >&2
            echo "" >&2
            echo "  A default value shadows buildx's per-platform injection," >&2
            echo "  causing all manifest entries to use the same architecture." >&2
            echo "  Use \`ARG <NAME>\` (no default). For single-arch builds," >&2
            echo "  pass --build-arg <NAME>=<value> explicitly (see build-image.sh)." >&2
            exit 1
          fi

          if ! grep -qE "^ARG TARGETARCH(\$|[[:space:]])" "$DOCKERFILE"; then
            echo "ERROR: ARG TARGETARCH (no default) not declared in $DOCKERFILE" >&2
            echo "  Expected at least one bare \`ARG TARGETARCH\` declaration so" >&2
            echo "  buildx's per-platform value flows into the build stage." >&2
            exit 1
          fi

          echo "OK: no predefined platform ARG has a default; ARG TARGETARCH is declared."

      - name: "Cleanup validation containers"
        if: always()
        shell: bash
        run: |
          docker rm -f netclaw-validate-ok 2>/dev/null || true
