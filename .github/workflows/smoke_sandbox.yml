name: smoke_sandbox

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: smoke-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Sandbox
    runs-on: arc-netclaw
    timeout-minutes: 45

    env:
      PROJECT_NAME: netclaw-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_OLLAMA_MODEL: qwen2:0.5b
      SMOKE_BUILD: 0
      INIT_TIMEOUT_SECONDS: 1200
      START_TIMEOUT_SECONDS: 180
      STEP_TIMEOUT_SECONDS: 120
      STOP_TIMEOUT_SECONDS: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: ./global.json

      - name: Publish CLI
        run: >
          dotnet publish src/Netclaw.Cli/Netclaw.Cli.csproj
          -c Release
          -r linux-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:EnableCompressionInSingleFile=true
          -o ./publish/cli

      - name: Publish Daemon
        run: >
          dotnet publish src/Netclaw.Daemon/Netclaw.Daemon.csproj
          -c Release
          -r linux-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:EnableCompressionInSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/daemon

      - name: Build smoke sandbox image
        timeout-minutes: 5
        run: >
          docker build
          -f docker/smoke/Dockerfile
          -t netclaw-smoke:local
          .

      - name: Start smoke sandbox
        run: bash scripts/smoke/up.sh

      - name: Run smoke checks
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          bash scripts/smoke/check.sh 2>&1 | tee smoke-logs/check.log

      - name: Collect smoke logs
        if: always()
        run: |
          mkdir -p smoke-logs
          bash scripts/smoke/collect-logs.sh smoke-logs

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-logs
          if-no-files-found: warn

      - name: Tear down smoke sandbox
        if: always()
        run: |
          SMOKE_REMOVE_VOLUMES=1 bash scripts/smoke/down.sh
