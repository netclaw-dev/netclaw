name: Publish Release Binaries

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1: Create the GitHub Release
  # ────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: arc-netclaw
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        lfs: true
        fetch-depth: 0

    - name: Validate tag matches VersionPrefix
      shell: bash
      run: |
        TAG_VERSION="${{ github.ref_name }}"
        PROPS_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('Directory.Build.props').getroot(); node=root.find('.//VersionPrefix'); print((node.text or '').strip() if node is not None else '')")

        if [ -z "$PROPS_VERSION" ]; then
          echo "Directory.Build.props is missing VersionPrefix" >&2
          exit 1
        fi

        if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
          echo "Tag version ($TAG_VERSION) does not match Directory.Build.props VersionPrefix ($PROPS_VERSION)" >&2
          exit 1
        fi

        echo "Version check passed: $TAG_VERSION"

    - name: Extract latest release notes
      shell: pwsh
      run: |
        $content = Get-Content RELEASE_NOTES.md -Raw
        # Match from the first #### heading to just before the second one
        if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
          $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
        } else {
          $content | Set-Content RELEASE_NOTES_LATEST.md
        }

    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      with:
        draft: false
        prerelease: false
        release_name: 'Netclaw ${{ github.ref_name }}'
        tag_name: ${{ github.ref }}
        body_path: RELEASE_NOTES_LATEST.md
      env:
        GITHUB_TOKEN: ${{ github.token }}

  # ────────────────────────────────────────────────────────────────────
  # Job 2: Build self-contained binaries (matrix: linux-x64, linux-arm64, win-x64)
  # ────────────────────────────────────────────────────────────────────
  publish-binaries:
    name: Build ${{ matrix.rid }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: arc-netclaw
            rid: linux-x64
            archive_ext: tar.gz
          # Disabled: no self-hosted ARM runner available yet
          # - os: ubuntu-24.04-arm
          #   rid: linux-arm64
          #   archive_ext: tar.gz
          # Disabled: no self-hosted Windows runner available yet
          # - os: windows-latest
          #   rid: win-x64
          #   archive_ext: zip
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        lfs: true
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5.2.0
      with:
        global-json-file: "./global.json"

    - name: Publish CLI
      run: >
        dotnet publish src/Netclaw.Cli/Netclaw.Cli.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained true
        /p:PublishSingleFile=true
        /p:EnableCompressionInSingleFile=true
        /p:IncludeNativeLibrariesForSelfExtract=true
        /p:Version=${{ github.ref_name }}
        -o ./publish/cli

    - name: Publish Daemon
      run: >
        dotnet publish src/Netclaw.Daemon/Netclaw.Daemon.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained true
        /p:PublishSingleFile=true
        /p:EnableCompressionInSingleFile=true
        /p:IncludeNativeLibrariesForSelfExtract=true
        /p:Version=${{ github.ref_name }}
        -o ./publish/daemon

    - name: Package archives (Linux)
      if: runner.os == 'Linux'
      run: |
        VERSION="${{ github.ref_name }}"
        RID="${{ matrix.rid }}"
        mkdir -p ./archives

        # CLI archive
        tar czf "./archives/netclaw-${VERSION}-${RID}.tar.gz" \
          -C ./publish/cli netclaw

        # Daemon archive
        tar czf "./archives/netclawd-${VERSION}-${RID}.tar.gz" \
          -C ./publish/daemon netclawd

    # Disabled: no self-hosted Windows runner available yet
    # - name: Package archives (Windows)
    #   if: runner.os == 'Windows'
    #   shell: pwsh
    #   run: |
    #     $VERSION = "${{ github.ref_name }}"
    #     $RID = "${{ matrix.rid }}"
    #     New-Item -ItemType Directory -Path ./archives -Force
    #     Compress-Archive -Path ./publish/cli/netclaw.exe `
    #       -DestinationPath "./archives/netclaw-${VERSION}-${RID}.zip"
    #     Compress-Archive -Path ./publish/daemon/netclawd.exe `
    #       -DestinationPath "./archives/netclawd-${VERSION}-${RID}.zip"

    - name: Compute checksums
      shell: bash
      run: |
        VERSION="${{ github.ref_name }}"
        RID="${{ matrix.rid }}"
        mkdir -p ./checksums

        for archive in ./archives/*; do
          filename=$(basename "$archive")
          if command -v sha256sum >/dev/null 2>&1; then
            sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          else
            sha256=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          fi
          size=$(stat -c%s "$archive" 2>/dev/null || stat -f%z "$archive" 2>/dev/null)
          echo "$sha256  $filename  $size" >> "./checksums/checksums-${RID}.txt"
        done

    - name: Upload archives to GitHub Release
      uses: AButler/upload-release-assets@v3.0
      with:
        repo-token: ${{ github.token }}
        release-tag: ${{ github.ref_name }}
        files: 'archives/*'

    - name: Install Wrangler
      run: |
        npm install wrangler@3.90.0 --include=optional
        echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

    - name: Upload CLI archive to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/${{ github.ref_name }}/netclaw-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --file=./archives/netclaw-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --content-type=application/octet-stream

    - name: Upload Daemon archive to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/${{ github.ref_name }}/netclawd-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --file=./archives/netclawd-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --content-type=application/octet-stream

    - name: Upload checksum artifacts
      uses: actions/upload-artifact@v7
      with:
        name: checksums-${{ matrix.rid }}
        path: ./checksums/

    # Share the self-contained binaries with publish-docker so it doesn't
    # have to re-run `dotnet publish`. Only the linux-x64 variant is
    # consumed by the Docker image today — if other RIDs get wired up
    # they can share this same artifact upload pattern.
    - name: Upload publish output for downstream jobs
      if: matrix.rid == 'linux-x64'
      uses: actions/upload-artifact@v7
      with:
        name: publish-output-${{ matrix.rid }}
        path: |
          ./publish/cli/netclaw
          ./publish/daemon/netclawd
        retention-days: 1

  # ────────────────────────────────────────────────────────────────────
  # Job 3: Build and publish netclawd Docker image to GHCR
  # ────────────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Image
    needs: publish-binaries
    # Temporarily disabled — not ready to publish netclawd images to GHCR yet.
    # Flip to `true` (or remove the guard) when the Docker release is ready.
    if: false
    runs-on: arc-netclaw
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        lfs: true
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Reuse the binaries produced by the publish-binaries job instead of
    # re-running `dotnet publish`. The Docker build script falls through
    # to its NO_BUILD=1 code path so it only invokes `docker build`.
    - name: Download publish output from publish-binaries
      uses: actions/download-artifact@v8
      with:
        name: publish-output-linux-x64
        path: .

    - name: Restore executable bit on published binaries
      shell: bash
      run: |
        ls -la ./publish/cli/netclaw ./publish/daemon/netclawd
        chmod +x ./publish/cli/netclaw ./publish/daemon/netclawd

    # Reuse the shared build script so the release image build matches the
    # PR validation build byte-for-byte. NO_BUILD=1 skips `dotnet publish`
    # and reuses the downloaded binaries directly.
    - name: Build image via scripts/docker/build-image.sh
      shell: bash
      run: |
        chmod +x scripts/docker/build-image.sh
        IMAGE_REPO=ghcr.io/aaronontheweb/netclawd \
        NO_BUILD=1 \
          scripts/docker/build-image.sh "${{ github.ref_name }}"

    - name: Tag additional aliases (latest + major.minor)
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ github.ref_name }}"
        STRIPPED="${VERSION#v}"
        MAJOR_MINOR=$(echo "$STRIPPED" | awk -F. '{print $1"."$2}')

        docker tag \
          "ghcr.io/aaronontheweb/netclawd:${VERSION}" \
          "ghcr.io/aaronontheweb/netclawd:latest"
        docker tag \
          "ghcr.io/aaronontheweb/netclawd:${VERSION}" \
          "ghcr.io/aaronontheweb/netclawd:v${MAJOR_MINOR}"

        echo "Tags ready:"
        docker images --format '{{.Repository}}:{{.Tag}}' ghcr.io/aaronontheweb/netclawd

    - name: Push all tags
      shell: bash
      run: |
        docker push --all-tags ghcr.io/aaronontheweb/netclawd

  # ────────────────────────────────────────────────────────────────────
  # Job 4: Generate binary manifest and deploy to Cloudflare Pages
  # ────────────────────────────────────────────────────────────────────
  publish-binary-manifest:
    name: Publish Binary Manifest
    needs: publish-binaries
    runs-on: arc-netclaw
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        lfs: true
        fetch-depth: 0

    - name: Download all checksum artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./checksums
        pattern: checksums-*
        merge-multiple: true

    - name: Fetch existing manifest
      run: |
        mkdir -p ./feeds/releases
        status=$(curl -sSL -o ./feeds/releases/manifest.json -w "%{http_code}" https://releases.netclaw.dev/manifest.json || true)

        if [ "$status" = "200" ]; then
          echo "Fetched existing manifest from releases.netclaw.dev"
        elif [ "$status" = "404" ]; then
          echo "No existing manifest published yet (first release)"
          rm -f ./feeds/releases/manifest.json
        else
          echo "Failed to fetch existing manifest (HTTP $status)" >&2
          exit 1
        fi

    - name: Generate release manifest
      run: |
        chmod +x ./feeds/scripts/generate-release-manifest.sh
        ./feeds/scripts/generate-release-manifest.sh \
          "${{ github.ref_name }}" \
          ./checksums \
          "https://releases.netclaw.dev"

    - name: Install minisign
      run: |
        sudo apt-get update
        sudo apt-get install -y minisign

    - name: Restore manifest signing key
      env:
        MANIFEST_SIGNING_KEY_B64: ${{ secrets.MANIFEST_SIGNING_KEY_B64 }}
      run: |
        if [ -z "$MANIFEST_SIGNING_KEY_B64" ]; then
          echo "MANIFEST_SIGNING_KEY_B64 secret is not set" >&2
          exit 1
        fi

        umask 077
        echo "$MANIFEST_SIGNING_KEY_B64" | base64 -d > /tmp/netclaw-manifest.key
        chmod 600 /tmp/netclaw-manifest.key

    - name: Sign manifest
      run: |
        minisign -S \
          -s /tmp/netclaw-manifest.key \
          -m ./feeds/releases/manifest.json \
          -x ./feeds/releases/manifest.json.sig \
          -t "netclaw release ${{ github.ref_name }}"

    - name: Verify manifest signature
      run: |
        minisign -V \
          -p ./feeds/releases/manifest.pub \
          -m ./feeds/releases/manifest.json \
          -x ./feeds/releases/manifest.json.sig

    - name: Prepare release feed artifacts
      run: |
        cp scripts/install.sh ./feeds/releases/install.sh
        cp scripts/install.ps1 ./feeds/releases/install.ps1

    - name: Install Wrangler
      run: |
        npm install wrangler@3.90.0 --include=optional
        echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

    - name: Upload release manifest to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/manifest.json
        --file=./feeds/releases/manifest.json
        --content-type=application/json

    - name: Upload release manifest signature to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/manifest.json.sig
        --file=./feeds/releases/manifest.json.sig
        --content-type=text/plain

    - name: Upload manifest public key to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/manifest.pub
        --file=./feeds/releases/manifest.pub
        --content-type=text/plain

    - name: Upload Linux install script to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/install.sh
        --file=./feeds/releases/install.sh
        --content-type=text/x-shellscript

    - name: Upload Windows install script to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/install.ps1
        --file=./feeds/releases/install.ps1
        --content-type=text/plain

    - name: Cleanup signing key
      if: always()
      run: rm -f /tmp/netclaw-manifest.key

  # ────────────────────────────────────────────────────────────────────
  # Job 5: Publish system skills feed to R2
  # ────────────────────────────────────────────────────────────────────
  publish-skills:
    name: Publish Skills Feed
    needs: publish-binary-manifest
    uses: ./.github/workflows/publish_skills.yml
    secrets: inherit
