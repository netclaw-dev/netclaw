name: pr_validation

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  test:
    name: Test-${{matrix.name}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: arc-netclaw
            name: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      # Pre-warm the npm cache so MCP stdio smoke tests don't time out downloading
      # @modelcontextprotocol/server-everything on the first npx invocation.
      - name: "Warm npm cache for MCP smoke tests"
        shell: bash
        run: npx -y @modelcontextprotocol/server-everything --version || true

      # .NET Framework tests can't run reliably on Linux, so we only do .NET 8

      - name: "dotnet test"
        shell: bash
        run: dotnet test -c Release

      - name: "CLI smoke tests"
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke/cli-smoke.sh
        env:
          BUILD_CONFIG: Release

  slopwatch:
    name: Slopwatch
    runs-on: arc-netclaw
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "slopwatch analyze"
        run: dotnet slopwatch analyze
