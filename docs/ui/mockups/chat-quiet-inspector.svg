  <text x="1139" y="39" class="small muted">event 5 of 9</text>

  <rect x="54" y="92" width="386" height="696" rx="4" fill="#171a21"/>
  <text x="78" y="126" class="small muted">TURN EVENTS</text>

  <text x="78" y="173" class="small success bold">Done</text>
