name: Publish Release Binaries

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1: Create the GitHub Release
  # ────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
        fetch-depth: 0

    - name: Validate tag matches VersionPrefix/VersionSuffix
      shell: bash
      run: |
        TAG_VERSION="${{ github.ref_name }}"
        # Split a prerelease tag (e.g. 0.19.0-beta1) into core + suffix. The .NET SDK
        # keeps the semver suffix in <VersionSuffix>, not <VersionPrefix>, so validate
        # each half. A stable tag (e.g. 0.18.1) has no suffix.
        TAG_PREFIX="${TAG_VERSION%%-*}"
        if [ "$TAG_VERSION" = "$TAG_PREFIX" ]; then
          TAG_SUFFIX=""
        else
          TAG_SUFFIX="${TAG_VERSION#*-}"
        fi

        # Enforce the dotted prerelease convention: each '.'-separated identifier in the
        # suffix must be all-letters or all-digits (e.g. 'beta.1'), never mixed ('beta1').
        # A mixed identifier is one opaque alphanumeric token that SemVer orders
        # lexically, so 'beta10' would rank BELOW 'beta2' — in this repo's comparator and
        # in the release manifest. The dotted form makes the number a numeric identifier.
        if [ -n "$TAG_SUFFIX" ]; then
          IFS='.' read -ra _suffix_ids <<< "$TAG_SUFFIX"
          for _id in "${_suffix_ids[@]}"; do
            if ! [[ "$_id" =~ ^[A-Za-z]+$ || "$_id" =~ ^[0-9]+$ ]]; then
              echo "Invalid prerelease identifier '$_id' in tag '$TAG_VERSION': mixes letters and digits." >&2
              echo "  Use the dotted form so the number orders numerically, e.g. '${TAG_PREFIX}-beta.1' (not '${TAG_PREFIX}-beta1')." >&2
              exit 1
            fi
          done
        fi

        PROPS_PREFIX=$(python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('Directory.Build.props').getroot(); node=root.find('.//VersionPrefix'); print((node.text or '').strip() if node is not None else '')")
        PROPS_SUFFIX=$(python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('Directory.Build.props').getroot(); node=root.find('.//VersionSuffix'); print((node.text or '').strip() if node is not None else '')")

        if [ -z "$PROPS_PREFIX" ]; then
          echo "Directory.Build.props is missing VersionPrefix" >&2
          exit 1
        fi

        if [ "$TAG_PREFIX" != "$PROPS_PREFIX" ] || [ "$TAG_SUFFIX" != "$PROPS_SUFFIX" ]; then
          echo "Tag ($TAG_VERSION) does not match Directory.Build.props (VersionPrefix=$PROPS_PREFIX, VersionSuffix=${PROPS_SUFFIX:-<none>})" >&2
          echo "  For this tag set <VersionPrefix>$TAG_PREFIX</VersionPrefix> and <VersionSuffix>$TAG_SUFFIX</VersionSuffix>." >&2
          exit 1
        fi

        echo "Version check passed: $TAG_VERSION (prefix=$TAG_PREFIX suffix=${TAG_SUFFIX:-<none>})"

    - name: Extract latest release notes
      shell: pwsh
      run: |
        $content = Get-Content RELEASE_NOTES.md -Raw
        # Match from the first #### heading to just before the second one
        if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
          $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
        } else {
          $content | Set-Content RELEASE_NOTES_LATEST.md
        }

    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      with:
        draft: false
        # A tag with a '-' is a semver prerelease (e.g. 0.19.0-beta1) → mark it a
        # GitHub prerelease so it never becomes the repo's "Latest" release.
        prerelease: ${{ contains(github.ref_name, '-') }}
        release_name: 'Netclaw ${{ github.ref_name }}'
        tag_name: ${{ github.ref }}
        body_path: RELEASE_NOTES_LATEST.md
      env:
        GITHUB_TOKEN: ${{ github.token }}

  # ────────────────────────────────────────────────────────────────────
  # Job 2: Build self-contained binaries
  # (matrix: linux-x64, linux-arm64, win-x64, osx-arm64)
  # ────────────────────────────────────────────────────────────────────
  publish-binaries:
    name: Build ${{ matrix.rid }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: macos-26
            rid: osx-arm64
            archive_ext: tar.gz
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: "./global.json"

    # Publish via the canonical publish script — the single source of truth
    # for `dotnet publish` flags, shared with the Docker image build and the
    # smoke-test harness. `shell: bash` runs on the Windows runner too (Git
    # Bash); `dotnet publish` itself is OS-agnostic.
    - name: Publish binaries
      shell: bash
      run: >
        bash scripts/build/publish-binaries.sh
        --rid ${{ matrix.rid }}
        --component all
        --output-dir ./publish
        --version ${{ github.ref_name }}

    - name: Package archives (Unix)
      if: runner.os != 'Windows'
      run: |
        VERSION="${{ github.ref_name }}"
        RID="${{ matrix.rid }}"
        mkdir -p ./archives

        # CLI archive
        tar czf "./archives/netclaw-${VERSION}-${RID}.tar.gz" \
          -C ./publish/cli netclaw

        # Daemon archive
        tar czf "./archives/netclawd-${VERSION}-${RID}.tar.gz" \
          -C ./publish/daemon netclawd

    - name: Package archives (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $VERSION = "${{ github.ref_name }}"
        $RID = "${{ matrix.rid }}"
        New-Item -ItemType Directory -Path ./archives -Force

        # CLI archive
        Compress-Archive -Path ./publish/cli/netclaw.exe `
          -DestinationPath "./archives/netclaw-${VERSION}-${RID}.zip"

        # Daemon archive
        Compress-Archive -Path ./publish/daemon/netclawd.exe `
          -DestinationPath "./archives/netclawd-${VERSION}-${RID}.zip"

    - name: Compute checksums
      shell: bash
      run: |
        VERSION="${{ github.ref_name }}"
        RID="${{ matrix.rid }}"
        mkdir -p ./checksums

        for archive in ./archives/*; do
          filename=$(basename "$archive")
          if command -v sha256sum >/dev/null 2>&1; then
            sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          else
            sha256=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          fi
          size=$(stat -c%s "$archive" 2>/dev/null || stat -f%z "$archive" 2>/dev/null)
          echo "$sha256  $filename  $size" >> "./checksums/checksums-${RID}.txt"
        done

    - name: Upload archives to GitHub Release
      uses: AButler/upload-release-assets@v4.0
      with:
        repo-token: ${{ github.token }}
        release-tag: ${{ github.ref_name }}
        files: 'archives/*'

    - name: Install Wrangler
      shell: bash
      run: |
        npm install wrangler@3.90.0 --include=optional
        echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

    - name: Upload CLI archive to R2
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/${{ github.ref_name }}/netclaw-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --file=./archives/netclaw-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --content-type=application/octet-stream

    - name: Upload Daemon archive to R2
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/${{ github.ref_name }}/netclawd-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --file=./archives/netclawd-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
        --content-type=application/octet-stream

    - name: Upload checksum artifacts
      uses: actions/upload-artifact@v7
      with:
        name: checksums-${{ matrix.rid }}
        path: ./checksums/

    # Share the self-contained binaries with publish-docker for multi-arch
    # image builds. Both linux-x64 and linux-arm64 upload their output.
    - name: Upload publish output for downstream jobs
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: publish-output-${{ matrix.rid }}
        path: |
          ./publish/cli/netclaw
          ./publish/daemon/netclawd
        retention-days: 1

  # ────────────────────────────────────────────────────────────────────
  # Job 3: Build and publish netclawd Docker image to GHCR
  # ────────────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Image (multi-arch)
    needs: publish-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download linux-x64 publish output
      uses: actions/download-artifact@v8
      with:
        name: publish-output-linux-x64
        path: ./artifacts/linux-x64

    - name: Download linux-arm64 publish output
      uses: actions/download-artifact@v8
      with:
        name: publish-output-linux-arm64
        path: ./artifacts/linux-arm64

    - name: Debug artifact layout
      shell: bash
      run: |
        echo "=== linux-x64 artifact ==="
        find ./artifacts/linux-x64 -type f
        echo "=== linux-arm64 artifact ==="
        find ./artifacts/linux-arm64 -type f

    - name: Prepare multi-arch publish layout
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p publish/cli-amd64 publish/daemon-amd64
        mkdir -p publish/cli-arm64 publish/daemon-arm64

        # download-artifact may or may not preserve the publish/ prefix
        find_binary() {
          find "$1" -name "$2" -type f | head -1
        }

        for arch_pair in "linux-x64:amd64" "linux-arm64:arm64"; do
          SRC="${arch_pair%%:*}"
          DST="${arch_pair##*:}"

          CLI=$(find_binary "./artifacts/${SRC}" "netclaw")
          DAEMON=$(find_binary "./artifacts/${SRC}" "netclawd")

          echo "[$DST] CLI=$CLI DAEMON=$DAEMON"

          cp "$CLI" "publish/cli-${DST}/netclaw"
          cp "$DAEMON" "publish/daemon-${DST}/netclawd"
        done

        chmod +x publish/cli-amd64/netclaw publish/daemon-amd64/netclawd
        chmod +x publish/cli-arm64/netclaw publish/daemon-arm64/netclawd

        echo "Layout:"
        ls -laR publish/cli-amd64/ publish/daemon-amd64/ publish/cli-arm64/ publish/daemon-arm64/

    - name: Compute image tags
      id: tags
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ github.ref_name }}"
        STRIPPED="${VERSION#v}"
        MAJOR_MINOR=$(echo "$STRIPPED" | awk -F. '{print $1"."$2}')
        REPO="ghcr.io/netclaw-dev/netclaw"

        # A prerelease tag (e.g. 0.19.0-beta1) must NOT move the floating stable tags
        # (:latest, :major.minor). It only gets its exact-version tag. The rolling
        # :beta tag is handled separately (see the update-docker-beta-tag job), which
        # tracks latestPrerelease so :beta survives a stable that supersedes a beta.
        case "$VERSION" in
          *-*) TAGS="${REPO}:${VERSION}" ;;
          *)   TAGS="${REPO}:${VERSION},${REPO}:latest,${REPO}:${MAJOR_MINOR}" ;;
        esac
        echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
        echo "Tags: $TAGS"

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        build-args: |
          NETCLAW_VERSION=${{ github.ref_name }}

  # ────────────────────────────────────────────────────────────────────
  # Job 4: Generate binary manifest and deploy to Cloudflare Pages
  # ────────────────────────────────────────────────────────────────────
  publish-binary-manifest:
    name: Publish Binary Manifest
    needs: publish-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The version the beta channel / Docker :beta tag should resolve to
      # (newest of {stable, prerelease}). Consumed by update-docker-beta-tag.
      latest_prerelease: ${{ steps.pointers.outputs.latest_prerelease }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
        fetch-depth: 0

    - name: Download all checksum artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./checksums
        pattern: checksums-*
        merge-multiple: true

    - name: Fetch existing manifest
      run: |
        mkdir -p ./feeds/releases
        status=$(curl -sSL -o ./feeds/releases/manifest.json -w "%{http_code}" https://releases.netclaw.dev/manifest.json || true)

        if [ "$status" = "200" ]; then
          echo "Fetched existing manifest from releases.netclaw.dev"
        elif [ "$status" = "404" ]; then
          echo "No existing manifest published yet (first release)"
          rm -f ./feeds/releases/manifest.json
        else
          echo "Failed to fetch existing manifest (HTTP $status)" >&2
          exit 1
        fi

    - name: Generate release manifest
      run: |
        chmod +x ./feeds/scripts/generate-release-manifest.sh
        ./feeds/scripts/generate-release-manifest.sh \
          "${{ github.ref_name }}" \
          ./checksums \
          "https://releases.netclaw.dev"

    - name: Read channel pointers
      id: pointers
      run: |
        LP=$(python3 -c "import json; print(json.load(open('./feeds/releases/manifest.json')).get('latestPrerelease',''))")
        if [ -z "$LP" ]; then
          echo "Generated manifest is missing latestPrerelease" >&2
          exit 1
        fi
        echo "latest_prerelease=$LP" >> "$GITHUB_OUTPUT"
        echo "latestPrerelease=$LP"

    - name: Install minisign
      run: |
        sudo apt-get update
        sudo apt-get install -y minisign

    - name: Restore manifest signing key
      env:
        MANIFEST_SIGNING_KEY_B64: ${{ secrets.MANIFEST_SIGNING_KEY_B64 }}
      run: |
        if [ -z "$MANIFEST_SIGNING_KEY_B64" ]; then
          echo "MANIFEST_SIGNING_KEY_B64 secret is not set" >&2
          exit 1
        fi

        umask 077
        echo "$MANIFEST_SIGNING_KEY_B64" | base64 -d > /tmp/netclaw-manifest.key
        chmod 600 /tmp/netclaw-manifest.key

    - name: Sign manifest
      run: |
        minisign -S \
          -s /tmp/netclaw-manifest.key \
          -m ./feeds/releases/manifest.json \
          -x ./feeds/releases/manifest.json.sig \
          -t "netclaw release ${{ github.ref_name }}"

    - name: Verify manifest signature
      run: |
        minisign -V \
          -p ./feeds/releases/manifest.pub \
          -m ./feeds/releases/manifest.json \
          -x ./feeds/releases/manifest.json.sig

    - name: Prepare release feed artifacts
      run: |
        cp scripts/install.sh ./feeds/releases/install.sh
        cp scripts/install.ps1 ./feeds/releases/install.ps1

    - name: Install Wrangler
      run: |
        npm install wrangler@3.90.0 --include=optional
        echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

    - name: Upload release manifest to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/manifest.json
        --file=./feeds/releases/manifest.json
        --content-type=application/json

    - name: Upload release manifest signature to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/manifest.json.sig
        --file=./feeds/releases/manifest.json.sig
        --content-type=text/plain

    - name: Upload manifest public key to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/manifest.pub
        --file=./feeds/releases/manifest.pub
        --content-type=text/plain

    # install.sh is the unified Unix installer — it handles Linux AND macOS
    # (uname -s -> darwin -> osx-arm64). There is intentionally one Unix script.
    - name: Upload Unix (Linux + macOS) install script to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/install.sh
        --file=./feeds/releases/install.sh
        --content-type=text/x-shellscript

    - name: Upload Windows install script to R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: >
        wrangler r2 object put
        netclaw-releases/install.ps1
        --file=./feeds/releases/install.ps1
        --content-type=text/plain

    - name: Cleanup signing key
      if: always()
      run: rm -f /tmp/netclaw-manifest.key

  # ────────────────────────────────────────────────────────────────────
  # Job 5: Move the rolling Docker :beta tag to the newest prerelease
  # ────────────────────────────────────────────────────────────────────
  # :beta tracks latestPrerelease (newest of {stable, prerelease}), mirroring the
  # install-script beta channel. Needs publish-docker (so the freshly built image
  # exists) and publish-binary-manifest (for the latestPrerelease value). When a
  # stable supersedes a beta, latestPrerelease == that stable and :beta follows it;
  # when an old stable line is patched while a newer beta is live, latestPrerelease
  # stays on the beta and :beta does not regress.
  update-docker-beta-tag:
    name: Update Docker :beta tag
    needs: [publish-docker, publish-binary-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Point :beta at latestPrerelease
      shell: bash
      run: |
        set -euo pipefail
        REPO="ghcr.io/netclaw-dev/netclaw"
        LP="${{ needs.publish-binary-manifest.outputs.latest_prerelease }}"
        if [ -z "$LP" ]; then
          echo "latest_prerelease output is empty — cannot move :beta" >&2
          exit 1
        fi
        echo "Pointing ${REPO}:beta at ${REPO}:${LP}"
        # imagetools create copies the (multi-arch) manifest list from the source tag
        # to :beta without rebuilding. The source image already exists in GHCR.
        docker buildx imagetools create --tag "${REPO}:beta" "${REPO}:${LP}"

  # ────────────────────────────────────────────────────────────────────
  # Job 6: Publish system skills feed to R2
  # ────────────────────────────────────────────────────────────────────
  publish-skills:
    name: Publish Skills Feed
    needs: publish-binary-manifest
    uses: ./.github/workflows/publish_skills.yml
    secrets: inherit
