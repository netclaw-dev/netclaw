<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netclaw TUI Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <!--
    Netclaw terminal-faithful prototype.
    The terminal is a fixed character grid (see COLS/ROWS in engine/screen.js)
    rendered as coalesced colored runs inside a <pre>, mirroring how Termina
    composes a cell buffer. Everything here must be reproducible in a real
    terminal — see the plan at ~/.claude/plans for the hard requirements.
  -->
  <header class="toolbar">
    <span class="brand">netclaw tui prototype</span>
    <label class="dev">
      screen
      <select id="screen-select"></select>
    </label>
    <label class="dev">
      <input type="checkbox" id="fit-toggle" checked /> fit width
    </label>
    <span class="hint">click the terminal, then use the keyboard (↑/↓ Enter Esc Space ←/→ Tab)</span>
  </header>

  <main id="stage" class="stage">
    <pre id="term" class="term" tabindex="0" aria-label="terminal"></pre>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
