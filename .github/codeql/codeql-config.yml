# CodeQL configuration for default setup.
#
# Default setup merges this file with the configuration it generates, so no advanced
# workflow is needed. Default setup reads the file only when the repository property
# github-codeql-config-file points at it. Set that property to:
#
#     .github/codeql/codeql-config.yml
#
# Without the property this file has no effect.
name: "Netclaw CodeQL config"

paths-ignore:
  # Fixture data only. These files hold deliberately secret-shaped values and broken
  # config, so a finding against them says nothing about the product.
  #
  # Do NOT exclude the eval scripts themselves. evals/ holds real tooling that forwards
  # provider API keys (background_fixture.py) and enforces file boundaries before it
  # copies session evidence (trial_evidence.py). Excluding that code would remove
  # security analysis from the paths that most need it.
  - evals/fixtures
  - evals/runs
